name: Telegram Queue Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/telegram-worker.yml"

permissions:
  contents: read

concurrency:
  group: telegram-queue-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      JHOW_APP_URL: ${{ vars.JHOW_APP_URL || 'https://jhow-ofertas.lovable.app' }}
      CRON_SECRET: ${{ secrets.TELEGRAM_CRON_SECRET }}
    steps:
      - name: Skip until cron secret is configured
        if: ${{ env.CRON_SECRET == '' }}
        run: echo "TELEGRAM_CRON_SECRET ainda não foi configurado no GitHub; worker permanece inativo."

      - name: Process Telegram queue
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             --max-time 60             --retry 2             --retry-delay 5             -X POST             -H "x-cron-secret: ${CRON_SECRET}"             "${JHOW_APP_URL%/}/api/telegram-worker"
